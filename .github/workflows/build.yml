name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify environment
        run: |
          echo "=== Java ==="
          java -version
          echo "=== Android Home ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME 2>/dev/null || echo "no ANDROID_HOME"
          echo "=== Gradle files ==="
          ls -la gradlew gradle/wrapper/ || true
          echo "=== NDK ==="
          ls $ANDROID_HOME/ndk/ 2>/dev/null || echo "no NDK"

      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/opencv
          key: opencv-4.9.0-android-v1

      - name: Download OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
          unzip -q opencv-4.9.0-android-sdk.zip
          mkdir -p app/src/main/cpp/opencv
          mv OpenCV-android-sdk/sdk app/src/main/cpp/opencv/
          ls app/src/main/cpp/opencv/sdk/native/jni/

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build Debug APK (verbose)
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      - name: Show tail of log if failed
        if: failure()
        run: |
          echo "════════════════════════════"
          echo "FIRST 100 LINES (real error)"
          echo "════════════════════════════"
          head -100 build.log
          echo ""
          echo "════════════════════════════"
          echo "GREP for FAILURE"
          echo "════════════════════════════"
          grep -A 30 "FAILURE:" build.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pooll8-debug-apk
          path: app/build/outputs/apk/debug/*.apk
