name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1" > /dev/null 2>&1

      - name: Download OpenCV
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.9.0/opencv-4.9.0-android-sdk.zip
          unzip -q opencv-4.9.0-android-sdk.zip
          mkdir -p app/src/main/cpp/opencv
          mv OpenCV-android-sdk/sdk app/src/main/cpp/opencv/

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace || true

      - name: Rename APKs
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/*.apk release_apks/pooll8-debug.apk || true
          cp app/build/outputs/apk/release/*.apk release_apks/pooll8-release-unsigned.apk || true
          ls -la release_apks/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pooll8 ${{ github.ref_name }}
          body: |
            ## Pooll8 ${{ github.ref_name }}

            Educational Android overlay for ball detection & trajectory calculation.

            ### Downloads
            - **pooll8-debug.apk** — Debug build (installable)
            - **pooll8-release-unsigned.apk** — Release build (needs signing)

            ### Installation
            1. Enable "Unknown sources"
            2. Install APK
            3. Grant Overlay permission
            4. Grant Screen Capture permission
            5. Press "Start Overlay"

            ### Warning
            Educational use only. Do not use with games you don't own.
          files: release_apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
